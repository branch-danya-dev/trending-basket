[run]
name = "bh_btc"
strategy = "buy_and_hold_btc"
universe = "core15"
interval = "1d"
period = "holdout"
initial_capital_usd = 10000

[costs]
taker_fee_bps = 5.5
maker_fee_bps = 2.0
slippage_bps = 2.0
